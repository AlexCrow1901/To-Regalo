<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Regalo 数据恢复</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 40px 20px; text-align: center; background: #f5f5f7; }
    .card { background: #fff; border-radius: 16px; padding: 40px 24px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    p { color: #666; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    button { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
    .success { color: #34c759; font-weight: bold; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>To Regalo 数据恢复</h1>
    <p>点击下面的按钮，即可从云端恢复所有联系人、聊天记录和字卡数据。恢复完成后会自动跳转到网站。</p>
    <button onclick="restore()">一键恢复所有数据</button>
    <div id="result"></div>
  </div>
  <script>
    const cloudData = {
    "version":  "1.0.0",
    "lastSync":  1792113526817,
    "keys": {}
};
    function restore() {
      Object.entries(cloudData.keys).forEach(([k,v]) => localStorage.setItem(k, v));
      document.getElementById('result').innerHTML = '<div class="success">✅ 数据恢复完成！正在跳转到网站...</div>';
      setTimeout(() => location.href = 'https://alexcrow1901.github.io/To-Regalo/index.html', 1500);
    }
  </script>
</body>
</html>
